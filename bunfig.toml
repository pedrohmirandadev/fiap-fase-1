[test]
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
coverageThreshold = { lines = 0.9, functions = 0.9 }
coveragePathIgnorePatterns = ["src/index.ts", "src/infrastructure/database/connection.ts", "src/infrastructure/database/migrate.ts", "src/infrastructure/database/seed.ts", "**/*.test.ts", "tests/support/**", "tests/mocks/**", "tests/factories/**"]
