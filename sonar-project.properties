sonar.projectKey=oficina-tech-challenge
sonar.projectName=Oficina Tech Challenge
sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPaths=tsconfig.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Testes de domínio também ficam junto ao código-fonte; não são código de produção.
sonar.sources=src
sonar.tests=src,tests
sonar.test.inclusions=src/**/*.test.ts,src/**/*.spec.ts,tests/**/*.test.ts,tests/**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,src/**/*.test.ts,src/**/*.spec.ts
# Mesmo escopo de cobertura dos pontos de entrada excluídos no bunfig.toml.
sonar.coverage.exclusions=src/index.ts,src/infrastructure/database/connection.ts,src/infrastructure/database/migrate.ts,src/infrastructure/database/seed.ts
